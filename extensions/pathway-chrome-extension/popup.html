<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Airnet Pathway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 290px;
      padding: 14px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #022349;
      color: #ffffff;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    h3 {
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }
    .status-badge.offline .status-dot {
      background: #ef4444;
    }

    /* Website Power Status Box */
    .site-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      padding: 9px 11px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .site-name {
      font-weight: 700;
      color: #e2e8f0;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .site-status-pill {
      font-size: 9.5px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .site-status-pill.on {
      background: #059669;
      color: #ffffff;
    }
    .site-status-pill.off {
      background: #dc2626;
      color: #ffffff;
    }

    /* Buttons */
    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 7px;
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-power-off {
      background: #dc2626;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.35);
    }
    .btn-power-off:hover { background: #b91c1c; }
    
    .btn-power-on {
      background: #059669;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.35);
    }
    .btn-power-on:hover { background: #047857; }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover { opacity: 0.92; }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Options Row */
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
      padding: 6px 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 8px;
    }
    .option-label { cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .shortcut {
      text-align: center;
      font-size: 10px;
      color: #7dd3fc;
      margin-top: 10px;
    }
    kbd {
      background: rgba(255,255,255,0.18);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 9.5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>🚀 Airnet Pathway</h3>
    <div class="status-badge" id="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Checking...</span>
    </div>
  </div>

  <!-- Current Website Status Card -->
  <div class="site-card">
    <div class="site-header">
      <span class="site-name" id="site-domain">Current Website</span>
      <span class="site-status-pill on" id="site-status-pill">Active</span>
    </div>
    <div style="font-size: 10.5px; color: #93c5fd;" id="site-desc">
      Floating screen & launcher pill are active.
    </div>
  </div>

  <div class="btn-col">
    <!-- Main Power Toggle: Turn Off / Turn On -->
    <button class="btn-power-off" id="power-toggle-btn">
      <span id="power-icon">⏻</span>
      <span id="power-text">Turn OFF Pathway on this Website</span>
    </button>

    <!-- Toggle Screen Visibility -->
    <button class="btn-primary" id="toggle-screen-btn">
      <span>⚡ Toggle Screen View</span>
    </button>

    <!-- Standalone Popout Window -->
    <button class="btn-secondary" id="popout-btn">
      <span>↗ Open Standalone Popout</span>
    </button>
  </div>

  <!-- Options Toggle -->
  <div class="option-row">
    <label class="option-label" for="pill-toggle-check">
      <span>Corner "🚀 Pathway" button</span>
    </label>
    <input type="checkbox" id="pill-toggle-check" checked style="cursor: pointer;" />
  </div>

  <div class="shortcut">Shortcut: <kbd>Alt</kbd> + <kbd>P</kbd></div>

  <script src="popup.js"></script>
</body>
</html>
